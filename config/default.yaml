model:
  # Preset from localllm/model/presets.py: gemma-4-12b | gemma-4-31b | qwen3.8-27b
  # (or pick one per run: LOCALLLM_PROFILE=gemma-4-31b / localllm-serve --model gemma-4-31b)
  name: gemma-4-12b
  quantization: ""            # "" = preset default (12B: q6_k | q5_k)
  # gguf_repo: ""             # optional overrides; leave empty to use the preset
  # gguf_file: ""
  # mmproj_file: ""
  cache_dir: models

service:
  host: 127.0.0.1
  port: 8090
  max_concurrent_requests: 2
  autostart_llama_server: true
  startup_timeout_sec: 300

llm:
  provider: local
  base_url: http://127.0.0.1:8090/v1
  model: gemma-4-12b-it
  timeout_sec: 600

llama_server:
  host: 127.0.0.1
  port: 8080
  context_size: 16384
  # Set to 0 to use all layers on GPU (CUDA or Metal)
  n_gpu_layers: 999
  jinja: true
  startup_timeout_sec: 300

generation:
  max_tokens: 4096
  temperature: 0.7
  top_p: 0.95
  enable_thinking: true
  stt_temperature: 0.1
  stt_max_tokens: 2048

ocr:
  visual_detail: high
  max_pages: 20

stt:
  sample_rate: 16000
  chunk_seconds: 28
  overlap_seconds: 2
  max_chunk_seconds: 30

# whisper:   # disabled — Gemma unified audio only
#   base_url: http://127.0.0.1:8091
#   timeout_sec: 3600

translate:
  source_language: null   # null = auto-detect via Gemma audio
  target_language: es
  max_tokens: 1024
  pipeline: split         # split = ASR then translate (best quality) | unified = one Gemma pass
  live:                   # Phase 2 — fixed windows (Gemma needs ~9s+ of audio per call)
    min_chunk_seconds: 9.0
    max_chunk_seconds: 10.0
    overlap_seconds: 1.0
    frame_ms: 30
    energy_threshold: 0.01

tts:
  engine: piper           # local offline TTS (piper-tts)
  model_dir: models/piper
  use_cuda: false

# Audio input for models that lack it (Gemma 4 31B, Qwen3.8-27B): the gateway
# starts this second llama-server and routes requests with audio parts to it.
audio_sidecar:
  mode: auto              # auto (only when the main model has no audio) | on | off
  name: gemma-4-12b
  quantization: q5_k      # 8.4 GB — leaves room for a ~20 GB main model on 48 GB Macs
  port: 8081
  context_size: 8192

# Remote comparison engine for live translation (paid API; free tier is rate-limited).
# API key: GEMINI_API_KEY env var or .env.local — never in this file.
gemini:
  live_translate_model: gemini-3.5-live-translate-preview
  echo_target_language: false
